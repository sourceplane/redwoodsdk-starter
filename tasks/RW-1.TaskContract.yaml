apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: RW-1
  title: "The spec"
spec:
  goal: The redwoodsdk-starter repository carries its intent, CI, shared tooling and spec index, and the epic's doc set and task contracts are on main — what the starter is, how each piece maps to Cloudflare and D1, the milestones, the risks
  affects:
    - intent.yaml
    - package.json
    - pnpm-workspace.yaml
    - pnpm-lock.yaml
    - turbo.json
    - .gitignore
    - .github/workflows/ci.yml
    - .vscode
    - tooling
    - apps
    - infra
    - packages
    - tests
    - specs
    - tasks
    - README.md
  doneWhen:
    - intent.yaml names the placeholder workspace and ci.yml plans nothing while it does
    - epic.yaml, README, design, implementation plan, risks and status are on main
    - the five task contracts are on main
  gates: []
