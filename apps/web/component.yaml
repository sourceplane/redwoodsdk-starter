apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The RedwoodSDK app (React Server Components on one Cloudflare Worker with Static Assets, built by Vite, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Vite build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    # The config the dry run and the deploy hand to wrangler. The Cloudflare
    # Vite plugin builds from wrangler.jsonc (its `main` is the source entry,
    # src/worker.tsx) and writes a deployable copy beside the Worker it emits
    # (`dist/worker/wrangler.json`: no_bundle, main index.js, assets
    # ../client) — but only once it has built, and the lane checks that this
    # file exists BEFORE build-app, in a job tree staged without dist/. So it
    # names wrangler.deploy.jsonc, committed as its fixture render, which says
    # what the generated one says (tests/web holds the two to each other).
    wranglerConfig: wrangler.deploy.jsonc

    # RedwoodSDK's build, through the Cloudflare Vite plugin, emits the Worker
    # under dist/worker and the browser's assets under dist/client — both
    # deploy in one `wrangler deploy` of wrangler.deploy.jsonc.
    workerEntrypoint: dist/worker/index.js
    assetsDir: dist/client

    # Per-env worker name: redwoodsdk-starter-web-{dev,stage,prod}.
    workerName: redwoodsdk-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Both wrangler configs are COMMITTED — their fixture renders, so the
    # composition's structure check (`test -f wrangler.deploy.jsonc`, before
    # the build, in a fresh checkout) passes. Every lane re-renders both here,
    # in its own job tree, for its own environment: stage and prod from the
    # wiring document their cloudflare-d1 apply published (secretEnv above,
    # resolved before the job's first step), so the Worker binds the real
    # database; dev, which no root applies to and which only verifies, from
    # the fixture. Then the build reads wrangler.jsonc, and the deploy
    # wrangler.deploy.jsonc.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-d1 --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev && node ../../tooling/wire/live.mjs --template wrangler.deploy.template.jsonc --out wrangler.deploy.jsonc --components cloudflare-d1 --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev && pnpm exec turbo run build --filter=@app/web

    # Smoke: the page renders to its end (`</html>` — a render that throws
    # partway through a streamed page still sent a 200) with its notes count
    # (`data-notes="N"`), and /api/health answers ok — which only the Worker
    # can, by counting the `notes` table through its DB binding: it proves the
    # database bound, the migrations applied and the Worker serving. Not the
    # site's name: that is the owner's to change, and HTML-escaped when it
    # carries an `&` or `'`. Read-only: a smoke on every deploy must not write
    # notes into prod. Each response is buffered before grep so an early match
    # cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q '</html>' && echo \"${html}\" | grep -Eq 'data-notes=\"[0-9]+\"' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
